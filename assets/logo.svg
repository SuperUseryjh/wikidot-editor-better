<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1A1D24" />
            <stop offset="100%" stop-color="#0B0E14" />
        </linearGradient>
        
        <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE" />
            <stop offset="100%" stop-color="#4FACFE" />
        </linearGradient>
        
        <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF512F" />
            <stop offset="60%" stop-color="#F09819" />
            <stop offset="100%" stop-color="#FFE066" />
        </linearGradient>

        <linearGradient id="coreGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#FFF3B0" stop-opacity="0.2" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#2A2E36" />
        </pattern>
    </defs>

    <rect width="500" height="500" rx="128" fill="url(#bgGradient)" />
    <rect width="500" height="500" rx="128" fill="url(#grid)" opacity="0.6" />
    
    <rect x="12" y="12" width="476" height="476" rx="116" fill="none" stroke="#2A2E36" stroke-width="4" />

    <circle cx="250" cy="250" r="180" fill="none" stroke="#2A2E36" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="250" cy="250" r="200" fill="none" stroke="#2A2E36" stroke-width="1" stroke-dasharray="6 12" opacity="0.5" />

    <g filter="url(#glow)">
        <path d="M 110 110 L 115 125 L 130 130 L 115 135 L 110 150 L 105 135 L 90 130 L 105 125 Z" fill="#F09819" />
        <path d="M 390 110 L 395 125 L 410 130 L 395 135 L 390 150 L 385 135 L 370 130 L 385 125 Z" fill="#00F2FE" />
        <path d="M 120 380 L 123 390 L 133 393 L 123 396 L 120 406 L 117 396 L 107 393 L 117 390 Z" fill="#FF512F" />
        <path d="M 380 380 L 383 390 L 393 393 L 383 396 L 380 406 L 377 396 L 367 393 L 377 390 Z" fill="#00F2FE" />
    </g>

    <g filter="url(#glow)">
        <path d="M 140 140 L 80 250 L 140 360" fill="none" stroke="url(#cyanGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
        
        <path d="M 360 140 L 420 250 L 360 360" fill="none" stroke="url(#cyanGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g filter="url(#glow)">
        <path d="M 275 90 
                 L 190 240 
                 L 245 240 
                 L 175 410 
                 L 310 220 
                 L 255 220 
                 Z" 
              fill="url(#orangeGradient)" 
              stroke="#FF512F" 
              stroke-width="2" 
              stroke-linejoin="miter" 
              stroke-miterlimit="4" />

        <path d="M 275 90 
                 L 225 230 
                 L 250 230 
                 L 175 410 
                 L 280 230 
                 L 255 230 
                 Z" 
              fill="url(#coreGradient)" />

        <path d="M 268 115 L 210 245 M 240 255 L 195 380" 
              stroke="#FFFFFF" 
              stroke-width="3" 
              stroke-linecap="round" 
              opacity="0.8" />
    </g>

    <line x1="170" y1="465" x2="330" y2="465" stroke="url(#cyanGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
</svg>
